<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳能透过谱图分析 - 3M</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="./storage.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
        }
        #chart_div {
            width: 100vw;
            height: 100vh;
        }
        #no_data {
            display: none;
            text-align: center;
            margin-top: 20%;
            color: #6c757d;
        }
        .chart-toolbar {
            position: fixed;
            z-index: 10;
            top: 1rem;
            left: 1rem;
        }
        .download-data-button {
            position: fixed;
            z-index: 10;
            right: 1rem;
            bottom: 1rem;
            display: none;
        }

        @media (max-width: 576px) {
            .download-data-button {
                right: 0.75rem;
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="chart-toolbar">
        <a href="index.html" class="btn btn-light shadow-sm">返回计算器</a>
    </div>
    <div id="no_data">
        <h2>暂无谱图数据。</h2>
        <p>请先在主页面上传文件并成功执行“开始计算”，然后再点击“显示谱图”。</p>
    </div>
    
    <div id="chart_div"></div>
    <button id="download_data_button" class="btn btn-dark shadow download-data-button" type="button">
        下载谱图数据（CSV）
    </button>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const chartData = await window.gb2680Storage.loadChart();
            const rawData = chartData ? JSON.stringify(chartData) : null;
            if (!rawData) {
                document.getElementById('no_data').style.display = 'block';
                return;
            }
            
            let data = null;
            try {
                // 兼容多种存储格式：有时数据被双重序列化（字符串内含 JSON）
                data = JSON.parse(rawData);
                // 如果解析后仍是字符串，说明存在二次序列化，再解析一次
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch (e2) { /* leave as-is */ }
                }
            } catch(e) {
                document.getElementById('no_data').style.display = 'block';
                return;
            }

            // 如果没有有效的谱图对象或波长数组，显示无数据提示并退出
            if (!data || !data.spectra || !Array.isArray(data.spectra.wl) || data.spectra.wl.length === 0) {
                document.getElementById('no_data').style.display = 'block';
                return;
            }

            const spectra = data.spectra;
            const fileName = data.fileIdent || "未知文件";

            function downloadSpectrumData() {
                const wavelengths = spectra.wl || [];
                const original = spectra.irr || [];
                const direct = spectra.direct || [];
                const total = spectra.total || [];
                const rowCount = Math.max(wavelengths.length, original.length, direct.length, total.length);
                const rows = [
                    ["波长 (nm)", "原始太阳能辐照度 (W/m²)", "直接透过谱图", "总透过谱图"].join(",")
                ];

                for (let index = 0; index < rowCount; index += 1) {
                    rows.push([
                        wavelengths[index] ?? "",
                        original[index] ?? "",
                        direct[index] ?? "",
                        total[index] ?? ""
                    ].join(","));
                }

                const csvBlob = new Blob(["\ufeff" + rows.join("\n")], {type: "text/csv;charset=utf-8;"});
                const downloadUrl = URL.createObjectURL(csvBlob);
                const downloadLink = document.createElement("a");
                const safeFileName = fileName.replace(/[\\/:*?"<>|]/g, "_");
                downloadLink.href = downloadUrl;
                downloadLink.download = "Spectrum_Data_" + safeFileName + ".csv";
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();
                URL.revokeObjectURL(downloadUrl);
            }

            const traceOrig = {
                x: spectra.wl,
                y: spectra.irr,
                mode: 'lines',
                name: '原始太阳能谱图',
                line: {color: '#ffc107', width: 2.5}
            };

            const traceDirect = {
                x: spectra.wl,
                y: spectra.direct,
                mode: 'lines',
                name: '直接透过谱图',
                line: {color: '#0d6efd', width: 2.5}
            };

            const traceTotal = {
                x: spectra.wl,
                y: spectra.total,
                mode: 'lines',
                name: '总透过谱图 (含二次传热)',
                line: {color: '#dc3545', width: 2.5}
            };

            const layout = {
                title: {
                    text: '<b>太阳能光��分布 (300 - 2500nm) - ' + fileName + '</b>',
                    font: { size: 24 }
                },
                xaxis: {
                    title: { text: "波长 Wavelength (nm)", font: {size: 16} },
                    dtick: 500,
                    minor: {
                        dtick: 100,
                        showgrid: true,
                        gridcolor: '#e5e5e5',
                    },
                    showgrid: true,
                    gridcolor: '#cccccc',
                    zeroline: false
                },
                yaxis: {
                    title: { text: "辐照度 Irradiance (W/m²)", font: {size: 16} },
                    showgrid: true,
                    gridcolor: '#cccccc', // 强制实线显示 (默认即为实现，这里用较深灰色明确展现)
                    zeroline: true,
                    zerolinecolor: '#999999'
                },
                legend: {
                    x: 0.99,
                    y: 0.99,
                    xanchor: 'right',
                    yanchor: 'top',
                    bgcolor: 'rgba(255,255,255,0.9)',
                    bordercolor: '#ced4da',
                    borderwidth: 1,
                    font: { size: 14 }
                },
                hovermode: "x unified",
                margin: {l: 80, r: 60, t: 80, b: 80}
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                scrollZoom: true,
                toImageButtonOptions: {
                    format: 'png',
                    filename: 'Spectrum_' + fileName,
                    height: 800,
                    width: 1200,
                    scale: 2
                }
            };

            Plotly.newPlot("chart_div", [traceOrig, traceDirect, traceTotal], layout, config);
            const downloadButton = document.getElementById("download_data_button");
            downloadButton.style.display = "block";
            downloadButton.addEventListener("click", downloadSpectrumData);
        });
    </script>
</body>
</html>
